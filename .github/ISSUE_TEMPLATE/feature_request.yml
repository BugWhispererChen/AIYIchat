name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述使用场景与预期效果。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么场景下需要这个功能
      placeholder: 例如：我希望 AI 能在群聊中识别多个用户并分别记住他们的偏好
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的实现方式（可选）
      placeholder: 例如：在用户表中增加 group_nickname 字段，按群隔离记忆
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他方案（可选）
      placeholder: 例如：也可以按群创建独立角色
    validations:
      required: false
