name: CI

# 只做三件不需要任何密钥与外部服务的事：ruff、mypy、pytest（mongomock 内存库）。
# 说明：`tools/eval/run_eval.py --gate` 需要真实 LLM 凭据、且会产生费用，
# 属于服务器侧的评测门禁，不在本 workflow 里跑。

on:
  push:
    branches: [developing]
  pull_request:
    branches: [developing]

jobs:
  static-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiyichat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            aiyichat/requirements.txt
            aiyichat/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 依赖版本取证
        # mypy 结果会随 dashscope/kuzu 的存根变化，把实际装到的版本打出来，
        # 日后有人松开上界能立刻在 CI 日志里看出口径变了
        run: pip show dashscope kuzu | grep -E "^(Name|Version):"

      - name: ruff check
        run: ruff check app tools

      - name: mypy
        # 硬门禁。历史上这一步曾设 continue-on-error：本地 venv 的 dashscope/kuzu 没有类型
        # 存根、被 ignore_missing_imports 遮蔽而全绿，CI 全新安装拿到带 py.typed 的版本后
        # 暴露 30 处真错。现两端口径已由 requirements 上界锁死、真错全部补齐。
        run: mypy app

      - name: pytest
        run: python -m pytest tools/test -q
