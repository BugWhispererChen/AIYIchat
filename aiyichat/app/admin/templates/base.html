<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}管理后台{% endblock %} - 爱易聊</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    {% include "partials/_design_tokens.html" %}
    <style>
        /* ── 全局重置 ─────────────────────────────────── */
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
        }

        /* ══════════════════════════════════════════════════════
           布局骨架：左侧固定侧边栏 + 右侧内容区
           ══════════════════════════════════════════════════════ */
        .app-shell { display: flex; min-height: 100vh; }

        /* ── 侧边栏 ───────────────────────────────────── */
        .sidebar {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: transform var(--transition);
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: 0 1.25rem;
            height: var(--topbar-h);
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-brand .brand-icon {
            width: 30px; height: 30px;
            border-radius: 9px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 700; font-size: .8rem;
            box-shadow: 0 3px 8px rgba(99,102,241,.3);
        }
        .sidebar-brand .brand-text {
            font-weight: 700; font-size: 1.02rem; color: var(--text);
        }
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 1rem .75rem;
        }
        .nav-group { margin-bottom: 1.1rem; }
        .nav-group-title {
            font-size: .7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--text-3);
            padding: 0 .75rem;
            margin-bottom: .35rem;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: .65rem;
            padding: .55rem .75rem;
            border-radius: var(--radius-sm);
            color: var(--text-2);
            text-decoration: none;
            font-size: .9rem;
            font-weight: 500;
            transition: all var(--transition);
            margin-bottom: 2px;
        }
        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
        .nav-item:hover { background: var(--surface-2); color: var(--text); }
        .nav-item.active {
            background: var(--primary-soft);
            color: var(--primary-hover);
            font-weight: 600;
        }
        .nav-item.active svg { opacity: 1; }
        .sidebar-footer {
            padding: .75rem;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .sidebar-footer .logout-btn {
            display: flex;
            align-items: center;
            gap: .55rem;
            padding: .55rem .75rem;
            border-radius: var(--radius-sm);
            color: var(--text-2);
            text-decoration: none;
            font-size: .9rem;
            transition: all var(--transition);
        }
        .sidebar-footer .logout-btn svg { width: 18px; height: 18px; }
        .sidebar-footer .logout-btn:hover { background: var(--danger-bg); color: var(--danger-text); }

        /* ── 内容区 ───────────────────────────────────── */
        .content-area {
            flex: 1;
            margin-left: var(--sidebar-w);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 900;
            height: var(--topbar-h);
            background: rgba(255,255,255,.85);
            backdrop-filter: saturate(180%) blur(8px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: 0 1.5rem;
        }
        .menu-toggle {
            display: none;
            background: none; border: none;
            color: var(--text); font-size: 1.3rem;
            cursor: pointer; padding: .2rem .4rem;
            width: auto; height: auto;
        }
        /* 面包屑 */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: .4rem;
            font-size: .88rem;
            color: var(--text-2);
        }
        .breadcrumb a { color: var(--text-2); text-decoration: none; }
        .breadcrumb a:hover { color: var(--primary); }
        .breadcrumb .sep { color: var(--text-3); }
        .breadcrumb .current { color: var(--text); font-weight: 600; }
        .main-content {
            flex: 1;
            padding: 1.75rem 2rem;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
        }

        /* ── 页面标题 ─────────────────────────────────── */
        .page-header { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .page-header h3 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -.01em;
        }
        .page-header .subtitle {
            color: var(--text-2);
            font-size: .9rem;
            margin-top: .3rem;
        }

        /* ══════════════════════════════════════════════════════
           通用组件
           ══════════════════════════════════════════════════════ */

        /* ── 内容卡片 ─────────────────────────────────── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.25rem;
        }
        .card h4 {
            margin: 0 0 1rem 0;
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--text);
        }
        .card-title-row {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: .6rem; margin-bottom: 1rem;
        }
        .card-title-row h4 { margin: 0; }

        /* ── 统计卡片 Grid ────────────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: stretch;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.35rem;
            box-shadow: var(--shadow);
            transition: box-shadow var(--transition), transform var(--transition);
            display: flex;
            flex-direction: column;
            gap: .5rem;
            min-height: 104px;
        }
        .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .stat-card .stat-head {
            display: flex; align-items: center; gap: .5rem;
            font-size: .82rem; color: var(--text-2); font-weight: 500;
        }
        /* 标题文字不换行，避免“角色总数 / 活跃”等被挤成两行 */
        .stat-card .stat-head > span:last-child {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stat-card .stat-icon {
            width: 38px; height: 38px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--primary-soft), var(--primary));
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(99,102,241,.25);
        }
        .stat-card .stat-icon svg { width: 20px; height: 20px; }
        .stat-card .value {
            font-size: 1.85rem; font-weight: 700; line-height: 1.1; color: var(--text);
        }
        .stat-card .value small { font-size: .85rem; color: var(--text-2); font-weight: 500; }

        /* ── Badge 标签（柔和浅底 + 圆角） ─────────────── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: .3rem;
            padding: .2rem .6rem;
            border-radius: 999px;
            font-size: .74rem;
            font-weight: 600;
            line-height: 1.5;
        }
        .badge-active   { background: var(--success-bg); color: var(--success-text); }
        .badge-inactive { background: var(--danger-bg);  color: var(--danger-text); }
        .badge-warning  { background: var(--warning-bg); color: var(--warning-text); }
        .badge-role-user      { background: var(--info-bg); color: var(--info-text); }
        .badge-role-assistant { background: #f5f3ff; color: #6d28d9; }
        .badge-neutral  { background: var(--surface-2); color: var(--text-2); }

        /* ── Alert 提示 ───────────────────────────────── */
        .alert {
            padding: .8rem 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            font-size: .88rem;
            display: flex;
            align-items: center;
            gap: .5rem;
            border: 1px solid transparent;
        }
        .alert-success { background: var(--success-bg); color: var(--success-text); border-color: #a7f3d0; }
        .alert-error   { background: var(--danger-bg);  color: var(--danger-text);  border-color: #fecaca; }
        .alert-warning { background: var(--warning-bg); color: var(--warning-text); border-color: #fde68a; }
        .alert-info    { background: var(--info-bg);    color: var(--info-text);    border-color: #c7d2fe; }

        /* ── 表格横向滚动容器 ───────────────────────── */
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table-wrap table { min-width: 100%; }
        .table-wrap td {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* table-wrap 内的表头：吸附参照是 .table-wrap 容器而非视口，
           top 需归零，否则表头下移 56px 遮挡首行数据 */
        .table-wrap table thead th { top: 0; }

        /* ── 表格（斑马纹 + 悬停高亮 + 粘性表头） ─────── */
        table {
            font-size: .88rem;
            border-collapse: collapse;
            width: 100%;
        }
        table thead th {
            background: var(--surface-2);
            font-weight: 600;
            font-size: .76rem;
            text-transform: uppercase;
            letter-spacing: .03em;
            color: var(--text-2);
            padding: 11px 14px;
            border-bottom: 1px solid var(--border-strong);
            vertical-align: middle;
            text-align: left;
            position: sticky;
            top: var(--topbar-h);
            z-index: 1;
        }
        table tbody td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            color: var(--text);
        }
        table tbody tr:nth-child(even) { background: rgba(249,250,251,.5); }
        table tbody tr:hover { background: var(--primary-soft); }
        table tbody tr:last-child td { border-bottom: none; }

        /* ── 分页 ─────────────────────────────────────── */
        .pagination {
            display: flex;
            gap: .4rem;
            justify-content: center;
            margin-top: 1.25rem;
            flex-wrap: wrap;
        }
        .pagination a {
            padding: .4rem .8rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-size: .85rem;
            color: var(--text-2);
            transition: all var(--transition);
        }
        .pagination a:hover { background: var(--surface-2); border-color: var(--text-3); }
        .pagination a.current { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* ── Bot / 通用小卡片 ─────────────────────────── */
        .bot-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.1rem 1.25rem;
            box-shadow: var(--shadow);
            transition: box-shadow var(--transition);
        }
        .bot-card:hover { box-shadow: var(--shadow-md); }
        /* 关联信息实体块 */
        .entity-tile {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem 1.15rem;
            background: var(--surface);
            transition: box-shadow var(--transition);
        }
        .entity-tile:hover { box-shadow: var(--shadow); }

        /* ── 表单元素 ─────────────────────────────────── */
        fieldset {
            margin-bottom: 1.25rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.35rem;
            background: var(--surface);
        }
        fieldset legend {
            font-weight: 700;
            font-size: .95rem;
            padding: 0 .5rem;
            color: var(--text);
        }
        textarea { min-height: 100px; max-height: 260px; font-size: .9rem; }
        input, select, textarea { font-size: .9rem !important; }
        /* 输入聚焦：柔和靛蓝光晕 */
        input:not([type="checkbox"]):not([type="radio"]):focus,
        select:focus, textarea:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px rgba(99,102,241,.12) !important;
        }
        label { font-size: 14px; color: var(--text); }
        .field-hint { color: var(--text-2); font-size: .8rem; }

        /* ── 按钮体系 ─────────────────────────────────── */
        button, [type="submit"], [type="button"], a[role="button"], .btn {
            height: var(--btn-height);
            padding: 0 1.15rem;
            font-size: 14px;
            font-weight: 500;
            line-height: 1;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
            transition: all var(--transition);
        }
        /* 小号按钮 */
        button.btn-sm, .btn-sm, button.small, button.btn-small, a[role="button"].btn-sm {
            height: var(--btn-sm-height);
            padding: 0 .8rem;
            font-size: 13px;
        }
        /* 幽灵按钮 */
        button.ghost, .btn.ghost, a[role="button"].ghost {
            background: transparent;
            color: var(--text-2);
            border: 1px solid var(--border-strong);
        }
        button.ghost:hover, .btn.ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--text-3); }
        /* 危险按钮 */
        button.danger, .btn.danger, [type="submit"].danger {
            background: var(--danger); border-color: var(--danger); color: #fff;
        }
        button.danger:hover, .btn.danger:hover { background: var(--danger-text); border-color: var(--danger-text); }
        /* 危险描边按钮 */
        button.danger.outline, .btn.danger.outline, button.outline.danger {
            background: transparent; color: var(--danger); border: 1px solid var(--danger);
        }
        button.danger.outline:hover, button.outline.danger:hover { background: var(--danger-bg); }
        /* 文本输入框/下拉框统一高度 */
        input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="color"]),
        select { height: var(--input-height); }
        /* 区块统一外边距 */
        fieldset, .card, article { margin-bottom: 1.25rem; }

        /* ── 消息气泡 ─────────────────────────────────── */
        .message-bubble {
            padding: .85rem 1.05rem;
            border-radius: 14px;
            margin-bottom: .85rem;
            max-width: 78%;
            position: relative;
            min-height: 48px;
            box-shadow: var(--shadow);
        }
        .message-bubble.user {
            background: var(--primary-soft);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .message-bubble.assistant {
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .message-meta { font-size: .74rem; color: var(--text-3); margin-top: .35rem; }
        .msg-media { margin-top: .4rem; }
        .msg-media img {
            max-width: 300px; max-height: 300px;
            border-radius: 10px; cursor: pointer; display: block;
            transition: opacity var(--transition);
        }
        .msg-media img:hover { opacity: .9; }
        .message-bubble .msg-delete-btn {
            position: absolute; top: 6px; right: 6px;
            width: 20px; height: 20px; border-radius: 50%;
            background: var(--danger); color: #fff;
            font-size: 12px; line-height: 1; text-align: center;
            cursor: pointer; opacity: 0; transition: opacity .15s;
            border: none; padding: 0;
        }
        .message-bubble:hover .msg-delete-btn { opacity: .7; }
        .message-bubble .msg-delete-btn:hover { opacity: 1; }

        /* ── 进度条 ───────────────────────────────────── */
        .progress-bar {
            height: 7px; background: var(--border-strong);
            border-radius: 999px; overflow: hidden; margin-top: .5rem;
        }
        .progress-bar .fill { height: 100%; border-radius: 999px; transition: width .6s ease; }
        .progress-bar .fill.green  { background: var(--success); }
        .progress-bar .fill.yellow { background: var(--warning); }
        .progress-bar .fill.red    { background: var(--danger); }
        .progress-bar .fill.blue   { background: var(--primary); }

        /* ── 搜索栏 ───────────────────────────────────── */
        .search-bar { display: flex; align-items: center; gap: .5rem; margin-bottom: 0; }
        .search-bar input[type="search"] { flex: 1; min-width: 0; width: auto !important; margin: 0; }
        .search-bar button, .search-bar [role="button"] { white-space: nowrap; flex-shrink: 0; width: auto !important; }

        /* ── HTMX 指示器 ──────────────────────────────── */
        .htmx-indicator { display: none; opacity: 0; transition: opacity .2s ease-in; }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline-block; opacity: 1; }

        /* ── 状态指示灯 ───────────────────────────────── */
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: .4rem; }
        .status-dot.online  { background: var(--success); box-shadow: 0 0 0 3px rgba(16,185,129,.15); }
        .status-dot.offline { background: var(--text-3); }
        .status-dot.pending { background: var(--warning); box-shadow: 0 0 0 3px rgba(245,158,11,.15); }

        /* ── 空状态 ───────────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 3.5rem 1rem;
            color: var(--text-2);
            animation: fade-in .3s ease;
        }
        .empty-state .empty-icon {
            width: 64px; height: 64px; margin: 0 auto 1.1rem;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, var(--surface-2), var(--primary-soft));
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--primary);
            box-shadow: inset 0 1px 2px rgba(16,24,40,.04);
        }
        .empty-state .empty-icon svg { width: 30px; height: 30px; opacity: .85; }
        .empty-state .empty-title { font-weight: 700; font-size: 1rem; color: var(--text); margin-bottom: .35rem; }
        .empty-state .empty-desc { font-size: .86rem; color: var(--text-2); }

        /* ── JS 标签页组件 ────────────────────────────── */
        .tabs { position: relative; }
        .tab-labels {
            display: flex;
            border-bottom: 1px solid var(--border-strong);
            gap: .25rem;
            margin-bottom: 1.35rem;
            flex-wrap: wrap;
        }
        .tab-label {
            padding: .65rem 1.1rem;
            cursor: pointer;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            font-weight: 500;
            color: var(--text-2);
            transition: all var(--transition);
            font-size: .92rem;
            height: auto;
            border-radius: 0;
        }
        .tab-label:hover { color: var(--primary); background: transparent; }
        .tab-label.active { color: var(--primary-hover); border-bottom-color: var(--primary); font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fade-in .2s ease; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

        /* ── 工具类 ───────────────────────────────────── */
        .text-ellipsis {
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            max-width: 100%; display: inline-block; vertical-align: middle;
        }
        /* 表格单元格内的 text-ellipsis 需要 block 才能正确截断 */
        td .text-ellipsis {
            display: block;
        }
        .form-actions, .btn-row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
        .muted { color: var(--text-2); }

        /* ── 详情页布局：左锚点导航 + 右分区卡片 ──────── */
        .detail-layout { display: grid; grid-template-columns: 190px 1fr; gap: 1.5rem; align-items: start; }
        .anchor-nav {
            position: sticky; top: calc(var(--topbar-h) + 1.5rem);
            display: flex; flex-direction: column; gap: .2rem;
        }
        .anchor-nav a {
            padding: .5rem .8rem; border-radius: var(--radius-sm);
            color: var(--text-2); text-decoration: none; font-size: .88rem;
            border-left: 2px solid transparent; transition: all var(--transition);
        }
        .anchor-nav a:hover { background: var(--surface-2); color: var(--text); }
        .anchor-nav a.active {
            color: var(--primary-hover); background: var(--primary-soft);
            border-left-color: var(--primary); font-weight: 600;
        }
        .anchor-nav .save-row { margin-top: .5rem; padding-top: .75rem; border-top: 1px solid var(--border); }
        .section-card { scroll-margin-top: calc(var(--topbar-h) + 1rem); }
        @media (max-width: 900px) {
            .detail-layout { grid-template-columns: 1fr; }
            .anchor-nav { position: static; flex-direction: row; flex-wrap: wrap; margin-bottom: 1rem; }
            .anchor-nav .save-row { display: none; }
        }

        /* ── 步骤条 ───────────────────────── */
        .steps { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .step {
            display: flex; align-items: center; gap: .5rem;
            padding: .5rem .9rem; border-radius: 999px;
            background: var(--surface); border: 1px solid var(--border);
            font-size: .85rem; color: var(--text-2);
        }
        .step .step-num {
            width: 22px; height: 22px; border-radius: 50%;
            background: var(--surface-2); color: var(--text-2);
            display: flex; align-items: center; justify-content: center;
            font-size: .75rem; font-weight: 700;
        }
        .step.active { border-color: var(--primary); color: var(--primary-hover); background: var(--primary-soft); font-weight: 600; }
        .step.active .step-num { background: var(--primary); color: #fff; }
        .step.done { color: var(--success-text); border-color: #a7f3d0; background: var(--success-bg); }
        .step.done .step-num { background: var(--success); color: #fff; }

        /* ── 监控面板 ─────────────────────────────────── */
        .monitor-panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow);
        }
        .monitor-panel h3 {
            font-size: 1.02rem; font-weight: 700; color: var(--text);
            margin: 0 0 1.2rem; padding-bottom: .8rem; border-bottom: 1px solid var(--border);
        }
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; }
        .chart-item { text-align: center; }
        .chart-item canvas { max-width: 150px; max-height: 150px; margin: 0 auto; }
        .chart-label { margin-top: .5rem; font-size: .85rem; font-weight: 600; color: var(--text-2); }
        .chart-value { font-size: 1.3rem; font-weight: 700; color: var(--text); }
        .server-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-top: 1.35rem; }
        .server-info-item { background: var(--surface-2); border-radius: var(--radius-sm); padding: 1rem; text-align: center; border: 1px solid var(--border); }
        .server-info-item .info-label { font-size: .78rem; color: var(--text-2); text-transform: uppercase; letter-spacing: .5px; }
        .server-info-item .info-value { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-top: .3rem; }

        /* ══════════════════════════════════════════════════════
           Toast 浮层提示
           ══════════════════════════════════════════════════════ */
        .toast-container {
            position: fixed; top: calc(var(--topbar-h) + 12px); right: 16px;
            z-index: 12000; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }
        .toast {
            padding: 12px 18px; border-radius: var(--radius-sm); color: #fff; font-size: 14px;
            box-shadow: var(--shadow-lg); animation: toast-in .3s ease, toast-out .3s ease 2.7s forwards;
            max-width: 360px; pointer-events: auto; word-break: break-word;
        }
        .toast.success { background: var(--success); }
        .toast.error   { background: var(--danger); }
        .toast.warning { background: var(--warning); }
        .toast.info    { background: var(--primary); }
        @keyframes toast-in { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: none; } }
        @keyframes toast-out { from { opacity: 1; } to { opacity: 0; } }

        /* ══════════════════════════════════════════════════════
           全局 Modal（确认 / 输入）
           ══════════════════════════════════════════════════════ */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(16,24,40,.45);
            z-index: 13000; display: flex; align-items: center; justify-content: center;
            padding: 1rem; opacity: 0; pointer-events: none; transition: opacity var(--transition);
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: var(--surface); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg); width: 100%; max-width: 420px;
            padding: 1.5rem; transform: translateY(8px) scale(.98); transition: transform var(--transition);
        }
        .modal-overlay.open .modal-box { transform: none; }
        .modal-box .modal-title { font-size: 1.05rem; font-weight: 700; color: var(--text); margin: 0 0 .6rem; }
        .modal-box .modal-message { font-size: .9rem; color: var(--text-2); margin: 0 0 1rem; line-height: 1.6; }
        .modal-box input.modal-input { width: 100%; margin-bottom: 1rem; }
        .modal-box .modal-actions { display: flex; justify-content: flex-end; gap: .6rem; }

        /* ══════════════════════════════════════════════════════
           响应式：移动端侧边栏折叠为抽屉
           ══════════════════════════════════════════════════════ */
        .sidebar-backdrop {
            display: none; position: fixed; inset: 0; background: rgba(16,24,40,.4);
            z-index: 999; opacity: 0; transition: opacity var(--transition);
        }
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); box-shadow: var(--shadow-lg); }
            .sidebar.open { transform: none; }
            .sidebar-backdrop.open { display: block; opacity: 1; }
            .content-area { margin-left: 0; }
            .menu-toggle { display: inline-flex; }
        }
        @media (max-width: 768px) {
            .main-content { padding: 1.25rem 1rem; }
            .stats-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
            .message-bubble { max-width: 92%; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            table { font-size: .8rem; }
        }

        /* ── 响应式工具类 ───────────────────────────── */
        .grid-5-col { display: grid; grid-template-columns: repeat(5, 1fr); gap: .5rem; align-items: end; }
        @media (max-width: 900px) {
            .grid-5-col { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 640px) {
            .grid-5-col { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .grid-5-col { grid-template-columns: 1fr; }
        }

        /* ── 必填字段视觉标记 ─────────────────────────── */
        input[required], select[required], textarea[required] {
            border-left: 3px solid var(--primary);
        }

        /* ── 主题切换按钮 ─────────────────────────────── */
        .theme-toggle {
            margin-left: auto;
            background: none; border: none; cursor: pointer;
            width: 36px; height: 36px; padding: 0;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: var(--radius-sm); color: var(--text-2);
            transition: all var(--transition);
        }
        .theme-toggle:hover { background: var(--surface-2); color: var(--text); }
        .theme-toggle svg { width: 18px; height: 18px; }
        .theme-toggle .icon-sun { display: none; }
        [data-theme="dark"] .theme-toggle .icon-sun { display: inline; }
        [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    </style>
    <script>
      /* 主题早期初始化：在首帧前恢复 localStorage 记忆，避免深色闪烁 */
      (function(){try{var t=localStorage.getItem('admin-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
    </script>

    <script>
    /* ══ 深色/浅色主题切换（localStorage 记忆） ══ */
    function toggleTheme() {
        var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        var next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('admin-theme', next); } catch (e) {}
    }
    window.toggleTheme = toggleTheme;

    /* ══ 侧边栏抽屉（移动端） ══ */
    function toggleSidebar(force) {
        var sb = document.getElementById('sidebar');
        var bd = document.getElementById('sidebarBackdrop');
        var open = (typeof force === 'boolean') ? force : !sb.classList.contains('open');
        sb.classList.toggle('open', open);
        bd.classList.toggle('open', open);
    }
    document.querySelectorAll('.sidebar-nav a').forEach(function(a) {
        a.addEventListener('click', function() { toggleSidebar(false); });
    });

    /* ══ JS 标签页 + sessionStorage 记忆 ══ */
    /* 用法：容器 .tabs[data-tabs-key="xxx"]，按钮 .tab-label[data-tab="id"]，内容 .tab-content[data-tab-content="id"] */
    function initTabs() {
        document.querySelectorAll('.tabs').forEach(function(tabs) {
            var key = tabs.dataset.tabsKey || 'tabs';
            var labels = tabs.querySelectorAll('.tab-label');
            var contents = tabs.querySelectorAll('.tab-content');
            if (!labels.length) return;
            function activate(id) {
                labels.forEach(function(l) { l.classList.toggle('active', l.dataset.tab === id); });
                contents.forEach(function(c) { c.classList.toggle('active', c.dataset.tabContent === id); });
                try { sessionStorage.setItem('tab:' + key, id); } catch (e) {}
            }
            labels.forEach(function(l) {
                l.addEventListener('click', function() { activate(l.dataset.tab); });
            });
            var saved = null;
            try { saved = sessionStorage.getItem('tab:' + key); } catch (e) {}
            var valid = saved && Array.prototype.some.call(labels, function(l) { return l.dataset.tab === saved; });
            activate(valid ? saved : labels[0].dataset.tab);
        });
    }

    /* ══ 全局 Modal（确认 / 输入） ══ */
    function adminModal(opts) {
        opts = opts || {};
        var overlay = document.getElementById('adminModalOverlay');
        var titleEl = document.getElementById('adminModalTitle');
        var msgEl = document.getElementById('adminModalMessage');
        var inputEl = document.getElementById('adminModalInput');
        var okBtn = document.getElementById('adminModalConfirm');
        var cancelBtn = document.getElementById('adminModalCancel');

        titleEl.textContent = opts.title || '请确认';
        msgEl.textContent = opts.message || '';
        msgEl.style.display = opts.message ? '' : 'none';
        okBtn.textContent = opts.confirmText || '确认';
        cancelBtn.textContent = opts.cancelText || '取消';
        okBtn.className = 'btn-sm' + (opts.danger ? ' danger' : '');

        if (opts.input) {
            inputEl.style.display = '';
            inputEl.value = opts.inputValue || '';
            inputEl.placeholder = opts.inputPlaceholder || '';
        } else {
            inputEl.style.display = 'none';
        }

        function close() {
            overlay.classList.remove('open');
            okBtn.onclick = null; cancelBtn.onclick = null;
            document.removeEventListener('keydown', onKey);
        }
        function doConfirm() { var v = inputEl.value; close(); if (opts.onConfirm) opts.onConfirm(v); }
        function onKey(e) {
            if (e.key === 'Escape') close();
            if (e.key === 'Enter' && !opts.input) doConfirm();
        }
        okBtn.onclick = doConfirm;
        cancelBtn.onclick = close;
        overlay.onclick = function(e) { if (e.target === overlay) close(); };
        document.addEventListener('keydown', onKey);
        overlay.classList.add('open');
        if (opts.input) setTimeout(function() { inputEl.focus(); }, 50);
    }
    window.adminModal = adminModal;

    /* 表单级确认：<form data-confirm="..." [data-danger] [data-prompt data-prompt-field=name]> */
    document.addEventListener('submit', function(e) {
        var form = e.target;
        if (!form.dataset || form.dataset.confirm === undefined) return;
        if (form.dataset.confirmed === '1') { form.dataset.confirmed = ''; return; }
        e.preventDefault();
        var isPrompt = form.dataset.prompt !== undefined;
        adminModal({
            title: form.dataset.confirmTitle || (form.dataset.danger !== undefined ? '危险操作确认' : '请确认'),
            message: form.dataset.confirm,
            danger: form.dataset.danger !== undefined,
            confirmText: form.dataset.confirmText || '确认',
            input: isPrompt,
            inputPlaceholder: form.dataset.promptPlaceholder || '',
            onConfirm: function(value) {
                if (isPrompt) {
                    var field = form.dataset.promptField || 'block_reason';
                    var inp = form.querySelector('input[name="' + field + '"]');
                    if (inp) inp.value = value || '';
                }
                form.dataset.confirmed = '1';
                if (form.requestSubmit) form.requestSubmit(); else form.submit();
            }
        });
    }, true);

    /* 按钮级确认（支持 formaction）：<button data-confirm="..." [data-danger]> */
    document.addEventListener('click', function(e) {
        var btn = e.target.closest('button[data-confirm], [role="button"][data-confirm]');
        if (!btn) return;
        if (btn.dataset.confirmed === '1') { btn.dataset.confirmed = ''; return; }
        var form = btn.closest('form');
        if (!form) return;
        e.preventDefault();
        adminModal({
            title: btn.dataset.confirmTitle || (btn.dataset.danger !== undefined ? '危险操作确认' : '请确认'),
            message: btn.dataset.confirm,
            danger: btn.dataset.danger !== undefined,
            confirmText: btn.dataset.confirmText || '确认',
            onConfirm: function() {
                btn.dataset.confirmed = '1';
                if (form.requestSubmit) form.requestSubmit(btn); else form.submit();
            }
        });
    }, true);

    /* ══ 防重复提交（跳过 HTMX 表单 / 已被 modal 拦截的表单） ══ */
    document.addEventListener('DOMContentLoaded', function() {
        initTabs();
        initAnchorSpy();
        document.querySelectorAll('form').forEach(function(form) {
            if (form.hasAttribute('hx-post') || form.hasAttribute('hx-get')
                || form.hasAttribute('hx-put') || form.hasAttribute('hx-delete')
                || form.hasAttribute('hx-patch')) return;
            form.addEventListener('submit', function(e) {
                if (e.defaultPrevented) return;
                var btn = form.querySelector('button[type="submit"], input[type="submit"]');
                if (btn && !btn.disabled) {
                    btn.dataset.originalText = btn.textContent;
                    btn.disabled = true;
                    btn.textContent = '提交中...';
                    setTimeout(function() { btn.disabled = false; btn.textContent = btn.dataset.originalText || '提交'; }, 5000);
                }
            });
        });
    });

    /* ══ 锚点导航滚动高亮（详情页） ══ */
    function initAnchorSpy() {
        var nav = document.querySelector('.anchor-nav');
        if (!nav || !('IntersectionObserver' in window)) return;
        var links = nav.querySelectorAll('a[href^="#"]');
        if (!links.length) return;
        var map = {};
        links.forEach(function(a) {
            var id = a.getAttribute('href').slice(1);
            var sec = document.getElementById(id);
            if (sec) map[id] = a;
        });
        var obs = new IntersectionObserver(function(entries) {
            entries.forEach(function(e) {
                if (e.isIntersecting) {
                    links.forEach(function(l) { l.classList.remove('active'); });
                    if (map[e.target.id]) map[e.target.id].classList.add('active');
                }
            });
        }, { rootMargin: '-20% 0px -70% 0px' });
        Object.keys(map).forEach(function(id) { obs.observe(document.getElementById(id)); });
    }

    /* ══ 全局 Toast ══ */
    function showToast(message, type) {
        type = type || 'success';
        var container = document.querySelector('.toast-container');
        if (!container) { container = document.createElement('div'); container.className = 'toast-container'; document.body.appendChild(container); }
        var toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 3000);
    }
    window.showToast = showToast;

    /* 表单原生校验失败反馈（避免“点击无反应”错觉；invalid 不冒泡，需捕获阶段监听）*/
    var _invalidShown = false;
    document.addEventListener('invalid', function(evt) {
        var field = evt.target;
        if (!_invalidShown) {
            _invalidShown = true;
            showToast('请检查表单：有字段填写不正确', 'error');
            setTimeout(function() { _invalidShown = false; }, 800);
            /* 延迟到原生校验 UI 之后，确定性地将首个无效字段滚动到视图中央 */
            setTimeout(function() {
                if (field && typeof field.scrollIntoView === 'function') {
                    field.scrollIntoView({ block: 'center' });
                }
            }, 30);
        }
    }, true);

    /* HTMX 请求结果反馈 */
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        var trigger = evt.detail && evt.detail.elt;
        if (evt.detail && evt.detail.successful) {
            if (trigger && trigger.dataset && trigger.dataset.successMsg) showToast(trigger.dataset.successMsg, 'success');
        } else if (evt.detail && evt.detail.failed) {
            var errMsg = (trigger && trigger.dataset && trigger.dataset.errorMsg) ? trigger.dataset.errorMsg : '操作失败，请重试';
            showToast(errMsg, 'error');
        }
    });
    /* HTMX 局部替换后重新初始化标签页 */
    document.body.addEventListener('htmx:afterSwap', function() { initTabs(); });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
