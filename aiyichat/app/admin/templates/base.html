<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}管理后台{% endblock %} - 爱易聊</title>
    <link rel="icon" href="data:,">
    {% include "partials/_assets_core.html" %}
    {% from "partials/_nav.html" import sidebar %}
    {% from "partials/_icons.html" import icon %}
    <link rel="stylesheet" href="{{ asset('css/admin.css') }}">
    <script src="{{ asset('vendor/htmx.min.js') }}"></script>
    <script src="{{ asset('js/admin.js') }}" defer></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="app-shell">
        <!-- ══ 侧边栏：导航项集中在 partials/_nav.html ══ -->
        <aside class="sidebar" id="sidebar">
            {{ sidebar(active_page) }}
        </aside>
        <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>

        <!-- ══ 内容区 ══ -->
        <div class="content-area">
            <div class="topbar">
                <button class="menu-toggle" onclick="toggleSidebar()" aria-label="打开菜单">
                    {{ icon('menu') }}
                </button>
                <button class="nav-collapse" id="navCollapseBtn" aria-label="收起或展开侧边栏" title="收起/展开侧边栏">
                    {{ icon('chevron-left') }}
                </button>
                <nav class="breadcrumb" aria-label="当前位置">{% block breadcrumb %}{% endblock %}</nav>
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换深色/浅色主题" title="切换深色/浅色">
                    {{ icon('sun', 'icon-sun') }}
                    {{ icon('moon', 'icon-moon') }}
                </button>
            </div>
            <main class="main-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- ══ 全局 Modal（确认 / 输入）══ -->
    <div class="modal-overlay" id="adminModalOverlay">
        <div class="modal-box" role="dialog" aria-modal="true">
            <h4 class="modal-title" id="adminModalTitle">请确认</h4>
            <p class="modal-message" id="adminModalMessage"></p>
            <input type="text" class="modal-input" id="adminModalInput" style="display:none;">
            <div class="modal-actions">
                <button type="button" class="ghost btn-sm" id="adminModalCancel">取消</button>
                <button type="button" class="btn-sm" id="adminModalConfirm">确认</button>
            </div>
        </div>
    </div>

    <div class="toast-container" aria-live="polite"></div>
</body>
</html>
