{# 设计令牌引导层。

   令牌的真实取值已外置到 static/css/tokens.css（由 partials/_assets.html 引入），

   1) 保留"设计系统 Design Tokens"的渲染标记，作为配色唯一来源的可追溯说明；

<!-- 设计系统 Design Tokens —— 取值见 /static/css/tokens.css，全局唯一样式来源 -->
<style>
    /* 暗色下少量硬编码组件的针对性微调（浅底/半透明背景重定义） */
    [data-theme="dark"] .topbar { background: rgba(35, 32, 27, .85); }
    [data-theme="dark"] table tbody tr:nth-child(even) { background: rgba(255, 255, 255, .03); }
    [data-theme="dark"] .badge-role-assistant { background: #2b2740; color: #c7d2fe; }
</style>
