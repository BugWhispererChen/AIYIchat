<!-- 分析进度 HTMX partial，每2秒轮询更新 -->
<h4>分析进度</h4>

{% if task.status == "error" %}
    <div class="ui-alert ui-alert--err" role="alert">分析失败: {{ task.error_message }}</div>
    <p class="u-mt-3"><a href="/admin/chat-import" class="ui-btn ui-btn--outline ui-btn--sm">重新上传</a></p>

{% elif task.status == "done" %}
    <!-- 分析完成，停止轮询 -->
    <div class="ui-stack ui-stack--tight u-mb-3">
        <progress value="100" max="100"></progress>
        <p class="ui-note ui-note--ok"><strong>分析完成！</strong></p>
    </div>
    <a href="/admin/chat-import/preview/{{ task.task_id }}" class="ui-btn ui-btn--primary ui-btn--sm">查看分析结果</a>

{% else %}
    <!-- 分析中，继续轮询 -->
    <div class="ui-stack ui-stack--tight"
         hx-get="/admin/chat-import/status/{{ task.task_id }}"
         hx-trigger="every 2s"
         hx-swap="outerHTML">
        <progress value="{{ task.progress }}" max="100"></progress>
        <p class="ui-note">{{ task.progress_text or "分析中..." }} ({{ task.progress }}%)</p>
    </div>
{% endif %}
