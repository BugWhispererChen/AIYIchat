{# 扫码绑定/登录二维码片段：由 QQ 与微信渠道路由共同渲染，
   样式集中在 admin.css，路由里不再拼内联 style。
   属性值一律交给 Jinja 自动转义（qrcode 来自外部接口，不可直接拼接）。 #}
<div class="qr-container">
    <p class="qr-lead">{{ lead }}</p>
    <img src="{{ image_src }}" alt="{{ alt }}" class="qr-image"
         {%- if data_bind_task %} data-bind-task="{{ data_bind_task }}"{% endif %}
         {%- if data_qrcode %} data-qrcode="{{ data_qrcode }}"{% endif %}>
    <p class="qr-hint">{{ hint }}</p>
</div>
