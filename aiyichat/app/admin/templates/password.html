{% extends "base.html" %}
{% set active_page = "password" %}
{% block title %}修改密码{% endblock %}

{% block content %}
<div class="page-header">
    <h3>修改密码</h3>
    <p class="subtitle">修改管理后台登录密码，修改成功后需使用新密码重新登录</p>
</div>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<form method="post" action="/admin/password">
    <div class="card" style="max-width:480px;">
        <h4 style="margin:0 0 0.8rem;">管理员账号</h4>
        <p class="muted" style="font-size:0.85rem;margin:0 0 0.8rem;">
            当前登录账号：<strong>{{ admin_username }}</strong>（登录名不可修改）；
            密码将以 PBKDF2 哈希形式安全存储，任何人（含数据库访问者）都无法还原明文。
        </p>

        <label for="current_password">当前密码</label>
        <input type="password" id="current_password" name="current_password" required
               autocomplete="current-password" placeholder="请输入当前密码">

        <label for="new_password">新密码</label>
        <input type="password" id="new_password" name="new_password" required
               minlength="8" autocomplete="new-password" placeholder="至少 8 位">

        <label for="confirm_password">确认新密码</label>
        <input type="password" id="confirm_password" name="confirm_password" required
               minlength="8" autocomplete="new-password" placeholder="再次输入新密码">

        <button type="submit" style="margin-top:0.9rem;max-width:200px;"
                data-confirm="修改成功后需要重新登录，确认修改密码？">修改密码</button>
    </div>
</form>
{% endblock %}
