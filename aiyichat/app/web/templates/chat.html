<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>对话 - 爱易聊</title>
    {# 空图标：避免浏览器默认去取 /favicon.ico 产生 404 控制台报错 #}
    <link rel="icon" href="data:,">
    {% include "partials/_assets.html" %}
    {% from "partials/_icons.html" import icon %}
    <script src="{{ asset('js/web-chat.js') }}" defer></script>
</head>
<body class="chat-body" data-token-key="aiyichat_web_token">
    <div class="web-topbar">
        <span class="brand"><span class="brand-dot"></span>爱易聊</span>
        <button type="button" class="icon-btn session-rail-toggle" id="session-toggle" aria-label="展开历史对话">
            {{ icon('clock') }}<span>历史</span>
        </button>
        <span class="quota-chip" id="quota-info">正在读取账号信息…</span>
        <span class="spacer"></span>
        <a class="icon-btn" href="/web/profiles">我的角色</a>
        <a class="icon-btn" href="/web/services">我的伙伴</a>
        <a class="icon-btn" href="/web/account">账号</a>
        <button class="icon-btn theme-btn" onclick="toggleTheme()" aria-label="切换深色/浅色主题" title="切换深色/浅色">
            {{ icon('sun', 'icon-sun') }}
            {{ icon('moon', 'icon-moon') }}
        </button>
        <button class="icon-btn" id="logout-btn">退出登录</button>
    </div>

    <!-- 伙伴（对话服务）选择：一个伙伴即一个可对话的角色 -->
    <div class="partner-bar">
        <label for="service-select">正在对话</label>
        <select id="service-select" disabled></select>
        <span class="links">
            <span class="system-note" id="loading-note">正在建立会话…</span>
        </span>
    </div>

    <div class="chat-main">
        <!-- 历史对话侧栏：点击即只读回看，不影响当前会话继续 -->
        <aside class="session-rail" id="session-rail" aria-label="历史对话">
            <div class="session-rail-head">
                <span class="kicker">History</span>
                <span class="quota-chip" id="browse-banner" hidden>
                    只读回看
                    <button type="button" class="icon-btn" id="browse-back">返回当前</button>
                </span>
            </div>
            <div class="session-list" id="session-list"></div>
        </aside>

        <div class="transcript-wrap">
            <div id="transcript" aria-live="polite">
                <div class="transcript-inner" id="transcript-inner">
                    <div class="transcript-empty" id="transcript-empty">
                        <span class="kicker">Begin</span>
                        <p>对话从这里开始，说点什么吧。</p>
                    </div>
                </div>
            </div>

            <form class="chat-input-bar" id="chat-form" data-stream-endpoint="/api/conversations/chat/stream">
                <div class="composer">
                    <textarea id="chat-input" name="text" rows="1" maxlength="2000"
                              placeholder="说点什么，回车发送" disabled></textarea>
                    <button type="submit" class="send-btn" id="send-btn" disabled>发送</button>
                </div>
            </form>
            <p class="composer-hint">Enter 发送 · Shift + Enter 换行</p>
        </div>
    </div>
</body>
</html>
