name: aiyichat

services:
  mongo:
    image: mongo:7
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mongo_data:/data/db
      # 备份输出卷：宿主机可 docker cp 或挂到自有备份目录，应用本身不含备份逻辑
      - mongo_backups:/backups
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 端口可配置：宿主机与容器内端口一致，默认 HTTPS 443 + HTTP 80（在 .env 中修改 HTTPS_PORT / HTTP_PORT）
    ports:
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
    environment:
      # 重定向进程拼接 Location 用的对外 HTTPS 端口（443 时省略端口号）
      - PUBLIC_HTTPS_PORT=${HTTPS_PORT:-443}
    env_file:
      - .env
    volumes:
      - ./certs:/app/certs:ro
      - ./.env:/app/.env
      # Kuzu 图数据库数据文件持久化（人际关系网络增强）
      - ./data/entity_graph:/app/data/entity_graph
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 健康检查端口读取容器内 HTTPS_PORT 环境变量（CMD-SHELL 形式）
      test: ["CMD-SHELL", "python -c \"import os,urllib.request,ssl;urllib.request.urlopen('https://localhost:'+os.environ.get('HTTPS_PORT','443')+'/api/health',context=ssl._create_unverified_context())\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
  mongo_backups:
