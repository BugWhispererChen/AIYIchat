name: aiyichat

services:
  mongo:
    image: mongo:7
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mongo_data:/data/db
      # 备份输出卷：宿主机可 docker cp 或挂到自有备份目录，应用本身不含备份逻辑
      - mongo_backups:/backups
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 一次性证书准备：镜像 CMD 硬要求 certs/selfsigned.{key,crt}，而 certs/ 不入 Git
  # 也不入部署包。缺这一步时，照 README 直接 `docker compose up` 的部署者只会看到
  # uvicorn 那句不指名文件的 FileNotFoundError。已有证书原样跳过，不覆盖正式证书。
  certgen:
    build: .
    restart: "no"
    # 宿主机环境变量不会自动进容器，需要显式透传：写 .env 或命令前缀都行
    environment:
      - CERT_EXTRA_HOSTS=${CERT_EXTRA_HOSTS:-}
    volumes:
      - ./certs:/app/certs
    command: ["python", "tools/ensure_certs.py"]

  app:
    build: .
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 端口可配置：宿主机与容器内端口一致，默认 HTTPS 443 + HTTP 80（在 .env 中修改 HTTPS_PORT / HTTP_PORT）
    ports:
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
    environment:
      # 重定向进程拼接 Location 用的对外 HTTPS 端口（443 时省略端口号）
      - PUBLIC_HTTPS_PORT=${HTTPS_PORT:-443}
    env_file:
      - .env
    volumes:
      # 证书目录对应用只读：写证书是 certgen 的事，应用进程不需要这个权限
      - ./certs:/app/certs:ro
      - ./.env:/app/.env
      # Kuzu 图数据库数据文件持久化（人际关系网络增强）
      - ./data/entity_graph:/app/data/entity_graph
    depends_on:
      mongo:
        condition: service_healthy
      # 证书没就绪就没必要起应用：起不来也只会在日志里留一句难懂的 TLS 报错
      certgen:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # 健康检查端口读取容器内 HTTPS_PORT 环境变量（CMD-SHELL 形式）
      test: ["CMD-SHELL", "python -c \"import os,urllib.request,ssl;urllib.request.urlopen('https://localhost:'+os.environ.get('HTTPS_PORT','443')+'/api/health',context=ssl._create_unverified_context())\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
  mongo_backups:
