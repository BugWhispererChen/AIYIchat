<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="爱易聊 AIYIchat —— 一套自托管的 AI 聊天服务提供平台，运营者内建渠道、台账、额度、审核与可观测，终端用户在 QQ 和微信里和 AI 伙伴聊天">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1b3a"/>
      <stop offset="55%" stop-color="#4b3a6b"/>
      <stop offset="100%" stop-color="#c98f79"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ec5ff"/>
      <stop offset="100%" stop-color="#ffd8a8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="460" fill="url(#bg)"/>
  <g opacity="0.16" fill="none" stroke="#ffffff" stroke-width="1.4">
    <path d="M-40 340 C 220 250, 420 390, 680 290 S 1120 190, 1340 280"/>
    <path d="M-40 388 C 240 306, 460 426, 720 336 S 1140 246, 1340 331"/>
  </g>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="120" cy="64" r="2"/><circle cx="300" cy="112" r="1.6"/><circle cx="1120" cy="86" r="2.2"/>
    <circle cx="980" cy="56" r="1.4"/><circle cx="1180" cy="168" r="1.8"/><circle cx="640" cy="46" r="1.5"/>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC',sans-serif">
    <text x="74" y="118" font-size="62" font-weight="700" fill="#ffffff">爱易聊 <tspan fill="url(#accent)">AIYIchat</tspan></text>
    <text x="74" y="166" font-size="24" fill="#e9e3f5">一套自托管的 AI 聊天服务提供平台 —— 部署一次，渠道、台账、额度、审核、可观测全部内建</text>

    <text x="74" y="212" font-size="15" font-weight="700" fill="#ffd8a8" opacity="0.92">给运营者 · 平台侧</text>
    <g font-size="18" fill="#ffffff">
      <g>
        <rect x="74" y="224" width="142" height="38" rx="19" fill="#ffffff" opacity="0.13"/>
        <text x="145" y="249" text-anchor="middle">三类渠道并发</text>
      </g>
      <g>
        <rect x="230" y="224" width="142" height="38" rx="19" fill="#ffffff" opacity="0.13"/>
        <text x="301" y="249" text-anchor="middle">服务台账三层</text>
      </g>
      <g>
        <rect x="386" y="224" width="160" height="38" rx="19" fill="#ffffff" opacity="0.13"/>
        <text x="466" y="249" text-anchor="middle">额度与订单台账</text>
      </g>
      <g>
        <rect x="560" y="224" width="150" height="38" rx="19" fill="#ffffff" opacity="0.13"/>
        <text x="635" y="249" text-anchor="middle">41 项能力开关</text>
      </g>
      <g>
        <rect x="724" y="224" width="142" height="38" rx="19" fill="#ffffff" opacity="0.13"/>
        <text x="795" y="249" text-anchor="middle">评测与可观测</text>
      </g>
      <g>
        <rect x="880" y="224" width="142" height="38" rx="19" fill="#ffffff" opacity="0.13"/>
        <text x="951" y="249" text-anchor="middle">内容安全审计</text>
      </g>
    </g>

    <text x="74" y="302" font-size="15" font-weight="700" fill="#8ec5ff" opacity="0.95">给使用者 · 用户侧</text>
    <g font-size="18" fill="#ffffff">
      <g>
        <rect x="74" y="314" width="124" height="38" rx="19" fill="#ffffff" opacity="0.13"/>
        <text x="136" y="339" text-anchor="middle">加好友即聊</text>
      </g>
      <g>
        <rect x="212" y="314" width="142" height="38" rx="19" fill="#ffffff" opacity="0.13"/>
        <text x="283" y="339" text-anchor="middle">五级长期记忆</text>
      </g>
      <g>
        <rect x="368" y="314" width="124" height="38" rx="19" fill="#ffffff" opacity="0.13"/>
        <text x="430" y="339" text-anchor="middle">情绪与主动</text>
      </g>
      <g>
        <rect x="506" y="314" width="148" height="38" rx="19" fill="#ffffff" opacity="0.13"/>
        <text x="580" y="339" text-anchor="middle">听 / 说 / 看 / 画</text>
      </g>
      <g>
        <rect x="668" y="314" width="160" height="38" rx="19" fill="#ffffff" opacity="0.13"/>
        <text x="748" y="339" text-anchor="middle">声音与风格克隆</text>
      </g>
      <g>
        <rect x="842" y="314" width="150" height="38" rx="19" fill="#ffffff" opacity="0.13"/>
        <text x="917" y="339" text-anchor="middle">11 位预置角色</text>
      </g>
    </g>

    <text x="74" y="404" font-size="19" fill="#f4e9df">MIT 开源 · 一个人一台机器长期运营 · Windows 双击安装自带数据库 · Linux 一行脚本部署</text>
  </g>
</svg>
