<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="爱易聊 AIYIchat —— 住在 QQ 和微信里的 AI 聊天伙伴">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1b3a"/>
      <stop offset="55%" stop-color="#4b3a6b"/>
      <stop offset="100%" stop-color="#c98f79"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ec5ff"/>
      <stop offset="100%" stop-color="#ffd8a8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <g opacity="0.16" fill="none" stroke="#ffffff" stroke-width="1.4">
    <path d="M-40 300 C 220 210, 420 350, 680 250 S 1120 150, 1340 240"/>
    <path d="M-40 340 C 240 260, 460 380, 720 290 S 1140 200, 1340 285"/>
  </g>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="120" cy="70" r="2"/><circle cx="300" cy="120" r="1.6"/><circle cx="1120" cy="90" r="2.2"/>
    <circle cx="980" cy="60" r="1.4"/><circle cx="1180" cy="180" r="1.8"/><circle cx="640" cy="52" r="1.5"/>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC',sans-serif">
    <text x="72" y="150" font-size="66" font-weight="700" fill="#ffffff">爱易聊 <tspan fill="url(#accent)">AIYIchat</tspan></text>
    <text x="74" y="202" font-size="26" fill="#e9e3f5">一个住在 QQ 和微信里的 AI 聊天伙伴 —— 记得住、懂情绪、会主动找你</text>

    <g font-size="19" fill="#ffffff">
      <g>
        <rect x="74" y="242" width="150" height="40" rx="20" fill="#ffffff" opacity="0.13"/>
        <text x="149" y="268" text-anchor="middle">五级长期记忆</text>
      </g>
      <g>
        <rect x="236" y="242" width="150" height="40" rx="20" fill="#ffffff" opacity="0.13"/>
        <text x="311" y="268" text-anchor="middle">情绪与心境</text>
      </g>
      <g>
        <rect x="398" y="242" width="176" height="40" rx="20" fill="#ffffff" opacity="0.13"/>
        <text x="486" y="268" text-anchor="middle">主动关怀与退让</text>
      </g>
      <g>
        <rect x="586" y="242" width="176" height="40" rx="20" fill="#ffffff" opacity="0.13"/>
        <text x="674" y="268" text-anchor="middle">听 / 说 / 看 / 画</text>
      </g>
      <g>
        <rect x="774" y="242" width="160" height="40" rx="20" fill="#ffffff" opacity="0.13"/>
        <text x="854" y="268" text-anchor="middle">声音与风格克隆</text>
      </g>
      <g>
        <rect x="946" y="242" width="150" height="40" rx="20" fill="#ffffff" opacity="0.13"/>
        <text x="1021" y="268" text-anchor="middle">一键自部署</text>
      </g>
    </g>

    <text x="74" y="330" font-size="20" fill="#f4e9df">MIT 开源 · 单机可跑 · Windows 安装包自带数据库 · 11 位预置角色开箱即用</text>
  </g>
</svg>
